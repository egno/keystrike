[project]
name = "keystrike-ai"
version = "0.1.0"
description = "LLM advisor plugin for keystrike (Ollama / OpenAI-compatible). Sends practice statistics to the configured server."
requires-python = ">=3.12"
license = "MIT"
dependencies = ["keystrike>=2.3"]

[project.entry-points."keystrike.advisors"]
llm = "keystrike_ai"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keystrike_ai"]

[tool.uv.sources]
keystrike = { workspace = true }
